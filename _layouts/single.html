---
layout: default
---

{% if page.url == "/" %}
<main class="home-main">
  <section class="hero">
    <div class="hero-inner">
      <p class="hero-tag">// hello, world</p>
      <h1 class="hero-name">Sangeet Satpathy</h1>
      <p class="hero-role">Computer Science + Electrical Engineering @ Stanford</p>
      <div class="hero-bio">
        {{ content }}
      </div>
      <div class="hero-cta">
        <a href="{{ '/experience/' | relative_url }}" class="btn-primary">Experience</a>
        <a href="{{ '/projects/' | relative_url }}" class="btn-outline">Projects</a>
      </div>
    </div>
  </section>
</main>
{% else %}
<main class="content-main">
  <div class="content-wrap">
    {% if page.title %}
    <div class="content-header">
      <h1>{{ page.title }}</h1>
    </div>
    {% endif %}
    <div class="content-body">
      {{ content }}
    </div>
  </div>
</main>
{% endif %}
